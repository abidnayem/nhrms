<section class="login-shell">
  <div class="login-card">
    <div class="brand-mark">N</div>
    <p class="eyebrow">NHRMS · Smart HR Platform</p>
    <h1>{{ mode === 'login' ? 'Welcome back' : 'Set up HR access' }}</h1>
    <p class="intro" *ngIf="mode === 'login'">Sign in with your employee account.</p>
    <p class="intro" *ngIf="mode === 'bootstrap'">Create the first HR manager account. This setup requires the one-time key configured by your administrator.</p>

    <div class="mode-tabs">
      <button type="button" [class.selected]="mode === 'login'" (click)="mode = 'login'; error = ''">Sign in</button>
      <button type="button" [class.selected]="mode === 'bootstrap'" (click)="mode = 'bootstrap'; error = ''">First-time setup</button>
    </div>

    <p class="error-message" *ngIf="error" role="alert" aria-live="polite">{{ error }}</p>
    <form *ngIf="mode === 'login'" (ngSubmit)="login()">
      <label>User name<input name="userName" [(ngModel)]="loginForm.userName" autocomplete="username" required /></label>
      <label>Password<input name="password" type="password" [(ngModel)]="loginForm.password" autocomplete="current-password" required /></label>
      <button class="primary-button" type="submit" [disabled]="busy">{{ busy ? 'Signing in…' : 'Sign in' }}</button>
    </form>
    <form *ngIf="mode === 'bootstrap'" (ngSubmit)="bootstrap()">
      <label>One-time bootstrap key<input name="key" type="password" [(ngModel)]="bootstrapForm.key" autocomplete="off" required /></label>
      <div class="form-grid">
        <label>Company code<input name="companyCode" [(ngModel)]="bootstrapForm.companyCode" required /></label>
        <label>Joining date<input name="dateOfJoining" type="date" [(ngModel)]="bootstrapForm.dateOfJoining" required /></label>
        <label>First name<input name="firstName" [(ngModel)]="bootstrapForm.firstName" required /></label>
        <label>Last name<input name="lastName" [(ngModel)]="bootstrapForm.lastName" required /></label>
        <label>Email<input name="email" type="email" [(ngModel)]="bootstrapForm.email" autocomplete="email" required /></label>
        <label>User name<input name="bootstrapUserName" [(ngModel)]="bootstrapForm.userName" autocomplete="username" required /></label>
        <label class="wide">Password (12+ characters)<input name="bootstrapPassword" type="password" [(ngModel)]="bootstrapForm.password" autocomplete="new-password" minlength="12" required /></label>
      </div>
      <button class="primary-button" type="submit" [disabled]="busy">{{ busy ? 'Creating account…' : 'Create HR manager account' }}</button>
    </form>
  </div>
</section>
